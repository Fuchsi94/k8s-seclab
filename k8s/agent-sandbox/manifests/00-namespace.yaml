# Namespace for agent sandboxes. Pod Security "baseline" allows root and
# NET_RAW inside the sandbox (needed for nmap SYN scans later); the isolation
# boundary is the Kata MicroVM from step 3 on. "warn: restricted" shows what
# would break under the stricter profile.
apiVersion: v1
kind: Namespace
metadata:
  name: sandboxes
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
