# agent-sandbox for the lab cluster.
#
#   export KUBECONFIG=~/.kube/gcp-sec-lab
#   kubectl apply --server-side -k k8s/agent-sandbox
#   k8s/agent-sandbox/test.sh
#
# vendor/ holds the unmodified release manifest of kubernetes-sigs/agent-sandbox
# v1.0.12 (sandbox-with-extensions.yaml), SHA-256
# 1fe83dff2536a643edf7d001c4585d77155176f6d570204f408159d9ac9d0fe5.
# To upgrade: download the new release file, check its hash, replace the file.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - vendor/sandbox-with-extensions-v1.0.12.yaml
  - manifests/00-namespace.yaml
  - manifests/10-network-policy.yaml
  - manifests/20-admission.yaml
  - manifests/30-template.yaml
  - manifests/40-rbac.yaml
  - manifests/50-quota.yaml

